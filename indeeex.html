<!DOCTYPE html>
<html lang="en">

<head>
	<title>Happy Birthday</title>
	<meta charset="UTF-8" />
	<meta name="description" content="Happy Birthday">
	<meta name="robots" content="index, follow" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimum-scale=1.0, maximum-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	
	<!-- Google Fonts for Aesthetic / Cute Look -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
	
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.1/css/bootstrap.min.css">
	<link rel="stylesheet" type="text/css" href="stylesheet.css">
	<link rel="stylesheet" type="text/css" href="loading.css">
	<link rel="stylesheet/less" href="cake.less">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/less.js/2.1.0/less.min.js"></script>

	<style>
		body {
			background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #f48fb1 100%);
			font-family: 'Quicksand', sans-serif;
			min-height: 100vh;
			margin: 0;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			color: #5c3d46;
		}

		.container {
			width: 100%;
			max-width: 600px;
			padding: 20px;
		}

		.message p {
			font-family: 'Fredoka', cursive;
			font-size: 20px;
			color: #d81b60;
			text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
		}

		.navbar-fixed-bottom {
			position: fixed;
			bottom: 30px;
			left: 0;
			right: 0;
			background: transparent;
			border: none;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		.btn-primary {
			background-color: #ff80ab !important;
			border-color: #ff4081 !important;
			color: #fff !important;
			font-family: 'Fredoka', cursive;
			font-size: 18px;
			padding: 12px 28px;
			border-radius: 25px;
			box-shadow: 0px 8px 15px rgba(255, 64, 129, 0.3);
			transition: all 0.3s ease;
			outline: none !important;
		}

		.btn-primary:hover {
			background-color: #ff4081 !important;
			transform: translateY(-3px) scale(1.05);
			box-shadow: 0px 12px 20px rgba(255, 64, 129, 0.4);
		}
	</style>
</head>

<body>
	<div class="loading"></div>
	<audio class="song" controls loop>
		<source src="hbd.mp3">
		Your browser isn't invited for super fun audio time.
	</audio>

	<div class="balloons text-center" id="b1"><h2 style="color:#F2B300;">H</h2></div>
	<div class="balloons text-center" id="b2"><h2 style="color:#0719D4;">B</h2></div>
	<div class="balloons text-center" id="b3"><h2 style="color:#D14D39;">D</h2></div>
	<div class="balloons text-center" id="b4"><h2 style="color:#8FAD00;">J</h2></div>
	<div class="balloons text-center" id="b5"><h2 style="color:#8377E4;">I</h2></div>
	<div class="balloons text-center" id="b6"><h2 style="color:#99C96A;">I</h2></div>
	<div class="balloons text-center" id="b7"><h2 style="color:#20CFB4;">I</h2></div>

	<img src="Balloon-Border.png" width="100%" class="balloon-border">

	<div class="container text-center">
		<div class="row">
			<div class="col-md-2 col-xs-2 bulb-holder"><div class="bulb" id="bulb_yellow"></div></div>
			<div class="col-md-2 col-xs-2 bulb-holder"><div class="bulb" id="bulb_red"></div></div>
			<div class="col-md-2 col-xs-2 bulb-holder"><div class="bulb" id="bulb_blue"></div></div>
			<div class="col-md-2 col-xs-2 bulb-holder"><div class="bulb" id="bulb_green"></div></div>
			<div class="col-md-2 col-xs-2 bulb-holder"><div class="bulb" id="bulb_pink"></div></div>
			<div class="col-md-2 col-xs-2 bulb-holder"><div class="bulb" id="bulb_orange"></div></div>
		</div>

		<div class="row">
			<div class="col-md-12 text-center">
				<img src="banner.png" class="bannar">
			</div>
		</div>

		<div class="row cake-cover">
			<div class="col-md-12 text-center">
				<div class="cake">
					<div class="velas">
						<div class="fuego"></div>
						<div class="fuego"></div>
						<div class="fuego"></div>
						<div class="fuego"></div>
						<div class="fuego"></div>
					</div>
					<div class="cobertura"></div>
					<div class="bizcocho"></div>
				</div>
			</div>
		</div>

		<div class="row message">
			<div class="col-md-12">
				<p>Today is...</p>
				<p>as beautiful as other days</p>
				<p>but you realize</p>
				<p>another year has gone</p>
				<p>in a blink of the eyes</p>
				<p><strong>however</strong></p>
				<p>Do you know..?</p>
				<p>today is just special</p>
				<p>so special to you</p>
				<p>thanks for everything</p>
				<p>I wish you all the best</p>
				<p>a very happy birthday Sapthesh V</p>
			</div>
		</div>

		<div class="navbar navbar-fixed-bottom">
			<button class="btn btn-primary" id="turn_on">Turn On Lights</button>
			<button class="btn btn-primary" id="play" style="display:none;">Play Music</button>
			<button class="btn btn-primary" id="bannar_coming" style="display:none;">Let's Decorate</button>
			<button class="btn btn-primary" id="balloons_flying" style="display:none;">Fly With Balloons</button>
			<button class="btn btn-primary" id="cake_fadein" style="display:none;">Most Delicious Cake Ever</button>
			<button class="btn btn-primary" id="light_candle" style="display:none;">Light Candle</button>
			<button class="btn btn-primary" id="wish_message" style="display:none;">Happy Birthday</button>
			<button class="btn btn-primary" id="story" style="display:none;">A message for you</button>
		</div>
	</div>

	<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.1/js/bootstrap.min.js"></script>
	<script src="effect.js"></script>
</body>

</html>
